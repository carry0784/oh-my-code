name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: 'Docker image tag (default: git SHA)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}
            type=raw,value=latest,enable=${{ inputs.environment == 'production' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: run migrations (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ inputs.environment }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run Alembic migrations
        run: alembic upgrade head
        env:
          DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}

  deploy:
    name: deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: [build, migrate]
    environment: ${{ inputs.environment }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Deploy (placeholder)
        run: |
          echo "Deploying image tag: ${{ needs.build.outputs.image_tag }}"
          echo "Target environment: ${{ inputs.environment }}"
          echo "---"
          echo "Replace this step with your deployment method:"
          echo "  - kubectl set image deployment/kdexter-api ..."
          echo "  - docker-compose -f docker-compose.prod.yml up -d"
          echo "  - helm upgrade kdexter ./helm-chart"

  smoke-test:
    name: post-deploy smoke test
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 5
    steps:
      - name: Health check
        run: |
          echo "Replace DEPLOY_URL with actual endpoint"
          echo "curl -sf \$DEPLOY_URL/health | jq '.status'"
          echo "curl -sf \$DEPLOY_URL/ready | jq '.ready'"
          echo "curl -sf \$DEPLOY_URL/status | jq '.overall_status'"
